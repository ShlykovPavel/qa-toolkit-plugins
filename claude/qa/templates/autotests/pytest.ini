[pytest]
testpaths = Tests
markers =
    smoke: быстрые happy-path проверки (Tests/Smoke_tests)
    regression: полная регрессия — CRUD и негативные сценарии (Tests/Regression_tests)
# слой: mobile
    mobile: мобильные Appium-тесты (Tests/Mobile_tests)
# /слой
# слой: frontend
    frontend: тесты веб-интерфейса (Tests/Frontend_tests)
# /слой
    slow: медленный тест (исключить: -m "not slow")
